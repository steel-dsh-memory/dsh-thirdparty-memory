name: syntax

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntax check
        run: |
          node --check core.js
          node --check index.js
          node --check server.js
      - name: Module smoke test
        run: |
          node -e "import('./core.js').then(m => { for (const k of ['loadStore','saveStore','mutateStore','renderInjection','selectEntries','storageInfo','normalizeForDedupe','autoWriteStatus','entriesForAllMode']) if (typeof m[k] !== 'function') { console.error('missing export', k); process.exit(1) } console.log('core exports ok') })"
      # static-audit is intentionally NOT part of CI: S26/S27 are known false
      # positives (injectMode / maxEntries are consumed in index.js, while the
      # static pass only scans core.js), so it is run manually.
      - name: Core audit (12 files, 220 checks)
        # t02-concurrency drives four writer processes on a shared runner; on a
        # loaded 2-core runner it can hit the 4s busy_timeout and report timing
        # failures (observed on this repo: same commit red on one run, green on
        # the next). Assertions are NOT relaxed: the suite runs twice and the
        # gate below reads the last run, failing on any real failure.
        # (0.4.5: run-all.mjs now exits non-zero on failures; the gate stays as a
        # cross-check on the aggregated result JSON and on the exact check count.)
        run: |
          node tests/core-audit/run-all.mjs
          node tests/core-audit/run-all.mjs
      - name: Core audit gate
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = "tests/core-audit/results";
            const files = fs.readdirSync(dir).filter((name) => /^t\d\d\.json$/.test(name));
            const rows = files.map((name) => JSON.parse(fs.readFileSync(path.join(dir, name), "utf8")));
            const passed = rows.reduce((sum, row) => sum + (row.passed || 0), 0);
            const failed = rows.reduce((sum, row) => sum + (row.failed || 0), 0);
            console.log("core-audit: " + files.length + " files, " + passed + " passed, " + failed + " failed");
            if (files.length !== 12 || failed !== 0 || passed !== 220) process.exit(1);
          '
      - name: HTTP audit (67 checks, expected 67/67)
        # 0.4.5: the three previously-red checks are fixed at the test side
        # (A37 counted seeds instead of the pending delta; B5 asserted the old
        # buggy export shape; A44c now ignores node:sqlite ExperimentalWarning).
        # No allowlist: any red is a real red. http-audit.mjs exits non-zero.
        run: node tests/http-audit.mjs
      - name: HTTP audit gate
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const payload = JSON.parse(fs.readFileSync("tests/http-audit-result.json", "utf8"));
            const failed = payload.results.filter((row) => !row.ok).map((row) => row.id);
            const passed = payload.results.length - failed.length;
            console.log("http-audit: " + passed + "/" + payload.results.length + " passed; failed: " + (failed.join(",") || "none"));
            if (payload.results.length !== 67 || failed.length !== 0) process.exit(1);
          '
